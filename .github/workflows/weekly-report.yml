name: Weekly ESPN Fantasy Recap

on:
  schedule:
    # 09:00 UTC = 5am ET (EDT) / 4am ET (EST) — early Tuesday morning, after ESPN
    # finalizes Monday Night Football stats. A fixed UTC cron drifts by an hour
    # across the DST boundary twice a year; adjust here if that matters to you.
    - cron: "0 9 * * 2"
  workflow_dispatch:
    inputs:
      week:
        description: "Explicit week to generate (leave blank for auto-detect)"
        required: false
        type: string

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf2.0-0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          SEASON_YEAR: ${{ secrets.SEASON_YEAR }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m src.main ${{ github.event.inputs.week && format('--week {0}', github.event.inputs.week) || '' }}

      - name: Commit report and lore back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ config/lore.md
          git diff --cached --quiet || git commit -m "Add weekly recap report [skip ci]"
          git push

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: reports/*.pdf
